name: 不具合の報告
description: アプリが思ったとおりに動かないとき
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。**ここに書いた内容は誰でも読めます。** アンケートの回答データ、名前や学校名などの個人情報は書かないでください。
  - type: textarea
    id: what
    attributes:
      label: 起きたこと
      description: 何をしたときに、どうなったか
      placeholder: 例：クロス集計で図の色を変えたら、図が消えた
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現する手順
      description: 同じことを起こすための手順（わかる範囲で）
      placeholder: |
        1. CSV を開く
        2. 「カイ二乗検定」を追加する
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: 本来はどうなってほしかったか
  - type: input
    id: version
    attributes:
      label: アプリの版
      description: アプリの「ご意見・不具合」から開くと自動で入ります
  - type: input
    id: env
    attributes:
      label: 端末とブラウザ
      description: アプリの「ご意見・不具合」から開くと自動で入ります
  - type: textarea
    id: log
    attributes:
      label: エラーの記録
      description: アプリの「ご意見・不具合」→「エラーの記録を写す」で写したものを貼り付けてください
      render: text
  - type: textarea
    id: shot
    attributes:
      label: 画面の写真（あれば）
      description: 回答のデータや個人情報が写っていないか確かめてから貼ってください
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: アンケートの回答データや個人情報を書いていません
          required: true
