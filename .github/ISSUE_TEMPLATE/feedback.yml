name: ご意見・要望
description: 使いにくい点、ほしい機能、そのほかのご意見
title: "[ご意見] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ご意見ありがとうございます。**ここに書いた内容は誰でも読めます。** 個人情報は書かないでください。
  - type: textarea
    id: idea
    attributes:
      label: ご意見・要望
      description: どんな場面で、何に困っているか・何がほしいか
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: アプリの版
  - type: input
    id: env
    attributes:
      label: 端末とブラウザ
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 個人情報を書いていません
          required: true
